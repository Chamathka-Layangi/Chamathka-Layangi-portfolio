<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#111B33" />
      <stop offset="100%" stop-color="#070D1F" />
    </linearGradient>
    <linearGradient id="p2-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p2-bg)" />

  <!-- UI Window Container -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0D1527" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Header Bar -->
