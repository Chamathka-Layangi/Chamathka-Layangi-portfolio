  <g transform="translate(290, 105)">
    <!-- Task 1 -->
    <rect x="0" y="0" width="440" height="52" rx="8" fill="#111B33" stroke="rgba(255,255,255,0.06)" />
    <circle cx="25" cy="26" r="9" fill="#10B981" />
    <path d="M 21 26 L 24 29 L 30 22" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <text x="48" y="25" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Implement Polymorphic Sensor Interface</text>
