    <text x="385" y="92" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">DONE</text>

    <!-- Task 3 -->
    <rect x="0" y="124" width="440" height="52" rx="8" fill="#111B33" stroke="rgba(0,240,255,0.3)" />
    <circle cx="25" cy="26+124" r="9" fill="none" stroke="#00F0FF" stroke-width="2" />
    <text x="48" y="149" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">TerraPulse Final Technical Documentation</text>
    <text x="48" y="166" fill="#38BDF8" font-family="sans-serif" font-size="11">In Review • Advanced Word Layout</text>
    <rect x="330" y="138" width="95" height="24" rx="12" fill="rgba(0,240,255,0.15)" stroke="#00F0FF" />
    <text x="377" y="154" fill="#00F0FF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">IN PROGRESS</text>

    <!-- Task 4 -->
    <rect x="0" y="186" width="440" height="52" rx="8" fill="#111B33" stroke="rgba(255,255,255,0.06)" />
    <circle cx="25" cy="26+186" r="9" fill="none" stroke="#64748B" stroke-width="2" />
    <text x="48" y="211" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Java Library Exception Handling Suite</text>
    <text x="48" y="228" fill="#94A3B8" font-family="sans-serif" font-size="11">Unit tests for borrow/return state</text>
    <rect x="345" y="200" width="80" height="24" rx="12" fill="rgba(148,163,184,0.15)" stroke="#94A3B8" />
    <text x="385" y="216" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PENDING</text>
