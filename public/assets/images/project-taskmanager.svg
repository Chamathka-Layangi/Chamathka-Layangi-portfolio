  <circle cx="75" cy="62" r="5" fill="#EF4444" />
  <circle cx="92" cy="62" r="5" fill="#F59E0B" />
  <circle cx="109" cy="62" r="5" fill="#10B981" />
  <text x="140" y="66" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Academic Task Manager — SLIIT Semester Tracker</text>

