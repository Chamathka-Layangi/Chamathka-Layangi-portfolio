  <text x="98" y="305" fill="#00F0FF" font-family="sans-serif" font-size="11" font-weight="800">PROGRESS: 86%</text>
  <rect x="98" y="318" width="144" height="8" rx="4" fill="#0B132B" />
  <rect x="98" y="318" width="124" height="8" rx="4" fill="#00F0FF" />
  <text x="98" y="348" fill="#94A3B8" font-family="sans-serif" font-size="10">12 Completed • 2 Pending</text>

