  <rect x="70" y="105" width="200" height="280" rx="10" fill="#090E1D" stroke="rgba(255,255,255,0.05)" />
  <text x="90" y="135" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">COURSES &amp; MODULES</text>
  
  <rect x="85" y="150" width="170" height="32" rx="6" fill="#1E293B" />
  <text x="98" y="171" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">● Java OOP (IT1050)</text>

  <rect x="85" y="190" width="170" height="32" rx="6" fill="#131B2E" />
  <text x="98" y="211" fill="#94A3B8" font-family="sans-serif" font-size="11">● Networks (IT1040)</text>

  <rect x="85" y="230" width="170" height="32" rx="6" fill="#131B2E" />
  <text x="98" y="251" fill="#94A3B8" font-family="sans-serif" font-size="11">● Software Eng (SE1020)</text>

