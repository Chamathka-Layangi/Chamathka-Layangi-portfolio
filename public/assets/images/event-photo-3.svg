<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="event3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="chart-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="telemetry-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#event3-bg)" />

  <!-- Browser / Dashboard Mockup Window -->
  <rect x="50" y="45" width="500" height="260" rx="10" fill="#0D1527" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
  
  <!-- Browser Chrome Top Bar -->
  <rect x="50" y="45" width="500" height="32" rx="10" fill="#131D35" />
  <circle cx="70" cy="61" r="5" fill="#EF4444" />
  <circle cx="85" cy="61" r="5" fill="#F59E0B" />
  <circle cx="100" cy="61" r="5" fill="#10B981" />
  
  <!-- Address Bar -->
  <rect x="130" y="52" width="280" height="18" rx="9" fill="#0A0F1D" />
  <text x="145" y="65" fill="#94A3B8" font-family="monospace" font-size="9">https://terrapulse-weather.sliit.lk/live</text>
  
  <!-- Live Signal Pill -->
  <circle cx="435" cy="61" r="4" fill="#10B981" filter="url(#telemetry-glow)" />
  <text x="445" y="64" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">ONLINE</text>

  <!-- Dashboard Metrics Cards Grid -->
  <rect x="75" y="95" width="130" height="60" rx="8" fill="#101B33" stroke="rgba(255,255,255,0.06)" />
  <text x="88" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">TEMPERATURE</text>
  <text x="88" y="142" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">28.4 °C</text>

  <rect x="220" y="95" width="130" height="60" rx="8" fill="#101B33" stroke="rgba(255,255,255,0.06)" />
  <text x="233" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">HUMIDITY</text>
  <text x="233" y="142" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">67.8 %</text>

  <rect x="365" y="95" width="155" height="60" rx="8" fill="#101B33" stroke="rgba(255,255,255,0.06)" />
  <text x="378" y="115" fill="#94A3B8" font-family="sans-serif" font-size="10">AIR QUALITY (MQ135)</text>
  <text x="378" y="142" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">42 PPM <tspan font-size="11" fill="#34D399">• Good</tspan></text>

  <!-- Live Wave Chart Area -->
  <rect x="75" y="170" width="445" height="115" rx="8" fill="#0A1020" stroke="rgba(255,255,255,0.05)" />
  <path d="M 85 240 Q 140 210, 190 250 T 300 210 T 400 230 T 510 190" fill="none" stroke="url(#chart-line-grad)" stroke-width="3" filter="url(#telemetry-glow)" />
  <circle cx="510" cy="190" r="5" fill="#00F0FF" />

  <!-- Overlay Footer Badge -->
  <rect x="40" y="325" width="520" height="50" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="rgba(255,255,255,0.1)" />
  <text x="60" y="355" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">STEP 3: WEB TELEMETRY</text>
  <text x="280" y="355" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Instant Cloud Sync &amp; Responsive Web Visualization</text>
</svg>
