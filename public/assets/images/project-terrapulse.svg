<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="p1-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#p1-bg)" />

  <!-- Grid overlay -->
  <g stroke="rgba(0, 240, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glowing Radar Circle in Background -->
  <circle cx="580" cy="225" r="160" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" />
  <circle cx="580" cy="225" r="110" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="580" cy="225" r="60" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" />
  <line x1="580" y1="65" x2="580" y2="385" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
  <line x1="420" y1="225" x2="740" y2="225" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
  <path d="M 580 225 L 720 140" stroke="#00F0FF" stroke-width="2.5" filter="url(#p1-filter)" />
  <circle cx="720" cy="140" r="5" fill="#00F0FF" filter="url(#p1-filter)" />

  <!-- Left Content Info -->
  <rect x="50" y="55" width="130" height="26" rx="13" fill="rgba(0, 240, 255, 0.12)" stroke="#00F0FF" stroke-width="1.5" />
  <text x="115" y="72" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">★ TOP 3 AWARD</text>

  <text x="50" y="130" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800">TerraPulse Smart IoT</text>
  <text x="50" y="170" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">Weather &amp; Climate Telemetry</text>
  
  <text x="50" y="215" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Real-time environmental monitoring powered by ESP32 microcontrollers,</text>
  <text x="50" y="238" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">sensor fusion (MQ135, DHT22, BMP180), and cloud analytics.</text>

  <!-- Metric Badges -->
  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="115" height="60" rx="10" fill="#0E1A36" stroke="rgba(0,240,255,0.3)" />
    <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">TEMP / HUMID</text>
    <text x="14" y="47" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">28°C / 68%</text>

    <rect x="125" y="0" width="115" height="60" rx="10" fill="#0E1A36" stroke="rgba(16,185,129,0.3)" />
    <text x="139" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">AIR QUALITY</text>
    <text x="139" y="47" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">42 PPM AQI</text>

    <rect x="250" y="0" width="115" height="60" rx="10" fill="#0E1A36" stroke="rgba(56,189,248,0.3)" />
    <text x="264" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">PRESSURE</text>
    <text x="264" y="47" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800">1013.2 hPa</text>
  </g>

  <!-- Tech tags bottom -->
  <g transform="translate(50, 375)">
    <rect x="0" y="0" width="70" height="26" rx="6" fill="#1E293B" /><text x="35" y="17" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">ESP32</text>
    <rect x="80" y="0" width="70" height="26" rx="6" fill="#1E293B" /><text x="115" y="17" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">MQ135</text>
    <rect x="160" y="0" width="70" height="26" rx="6" fill="#1E293B" /><text x="195" y="17" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">DHT22</text>
    <rect x="240" y="0" width="95" height="26" rx="6" fill="#1E293B" /><text x="287" y="17" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">ThingSpeak</text>
  </g>
</svg>
