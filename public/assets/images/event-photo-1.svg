<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="event1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="pcb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F281E" />
      <stop offset="100%" stop-color="#061810" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#event1-bg)" />

  <!-- Breadboard & Hardware Rig -->
  <rect x="60" y="80" width="480" height="240" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  
  <!-- Breadboard Tie Points grid simulation -->
  <g fill="#475569" opacity="0.4">
    <circle cx="90" cy="110" r="2" /><circle cx="110" cy="110" r="2" /><circle cx="130" cy="110" r="2" /><circle cx="150" cy="110" r="2" />
    <circle cx="90" cy="130" r="2" /><circle cx="110" cy="130" r="2" /><circle cx="130" cy="130" r="2" /><circle cx="150" cy="130" r="2" />
    <circle cx="90" cy="150" r="2" /><circle cx="110" cy="150" r="2" /><circle cx="130" cy="150" r="2" /><circle cx="150" cy="150" r="2" />
    <circle cx="90" cy="170" r="2" /><circle cx="110" cy="170" r="2" /><circle cx="130" cy="170" r="2" /><circle cx="150" cy="170" r="2" />
    <circle cx="90" cy="190" r="2" /><circle cx="110" cy="190" r="2" /><circle cx="130" cy="190" r="2" /><circle cx="150" cy="190" r="2" />
  </g>

  <!-- ESP32 Module -->
  <rect x="180" y="110" width="130" height="180" rx="6" fill="#0B132B" stroke="#00F0FF" stroke-width="2" />
  <rect x="200" y="125" width="90" height="70" rx="4" fill="#1C2438" stroke="#38BDF8" stroke-width="1" />
  <text x="245" y="155" fill="#00F0FF" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="700" text-anchor="middle">ESP-WROOM-32</text>
  <text x="245" y="175" fill="#94A3B8" font-family="monospace" font-size="9" text-anchor="middle">Wi-Fi + BLE</text>
  <circle cx="210" cy="270" r="4" fill="#10B981" filter="url(#neon-glow)" />
  <text x="222" y="273" fill="#10B981" font-family="monospace" font-size="9">PWR LED</text>

  <!-- Sensor Modules -->
  <!-- MQ-135 Gas Sensor -->
  <circle cx="360" cy="150" r="32" fill="#334155" stroke="#F59E0B" stroke-width="2" />
  <circle cx="360" cy="150" r="20" fill="#1E293B" stroke="#F59E0B" stroke-dasharray="3 3" />
  <text x="360" y="195" fill="#FBBF24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">MQ-135 Air</text>

  <!-- DHT22 / BMP180 -->
  <rect x="420" y="120" width="70" height="90" rx="5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
  <text x="455" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">DHT22</text>
  <text x="455" y="180" fill="#BAE6FD" font-family="sans-serif" font-size="8" text-anchor="middle">Temp/Humidity</text>

  <!-- Jumper Wires -->
  <path d="M 290 220 C 330 220, 330 170, 360 170" fill="none" stroke="#EF4444" stroke-width="2.5" />
  <path d="M 290 235 C 340 235, 380 200, 420 180" fill="none" stroke="#3B82F6" stroke-width="2.5" />
  <path d="M 290 250 C 350 260, 410 240, 440 210" fill="none" stroke="#10B981" stroke-width="2.5" />

  <!-- Overlay Badge -->
  <rect x="40" y="325" width="520" height="50" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="rgba(255,255,255,0.1)" />
  <text x="60" y="355" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">STEP 1: HARDWARE PROTOTYPING</text>
  <text x="320" y="355" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">ESP32 + Multi-Sensor Array Breadboard Integration</text>
</svg>
