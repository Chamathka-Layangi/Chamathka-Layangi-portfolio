<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="profile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="silhouette-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#profile-bg)" />
  
  <!-- Subtle Ambient Glow Behind Head -->
  <circle cx="250" cy="210" r="130" fill="#00F0FF" opacity="0.08" />

  <!-- Head Silhouette -->
  <circle cx="250" cy="190" r="85" fill="#1E293B" stroke="url(#accent-stroke)" stroke-width="2.5" />
  
  <!-- Shoulders & Torso Silhouette -->
  <path d="M 120 460 C 120 340 180 305 250 305 C 320 305 380 340 380 460 Z" fill="#1E293B" stroke="url(#accent-stroke)" stroke-width="2.5" />
</svg>
