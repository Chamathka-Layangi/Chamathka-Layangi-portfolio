<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="java-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p3-bg)" />

  <!-- Terminal Window Chrome -->
  <rect x="50" y="40" width="700" height="370" rx="12" fill="#0A0F1D" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <rect x="50" y="40" width="700" height="40" rx="12" fill="#111B30" />
  <circle cx="75" cy="60" r="5" fill="#EF4444" />
  <circle cx="92" cy="60" r="5" fill="#F59E0B" />
  <circle cx="109" cy="60" r="5" fill="#10B981" />
  <text x="400" y="65" fill="#94A3B8" font-family="'Plus Jakarta Sans', monospace" font-size="12" text-anchor="middle">terminal ~ java -cp ./bin com.sliit.library.MainApp</text>

  <!-- Java Logo Badge -->
  <rect x="670" y="48" width="65" height="24" rx="4" fill="#EA580C" />
  <text x="702" y="64" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">JAVA OOP</text>

  <!-- Code / Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" xml:space="preserve">
    <text x="75" y="115" fill="#38BDF8">═════════════════════════════════════════════════════════════════════</text>
    <text x="75" y="135" fill="#00F0FF" font-weight="700">  [SLIIT LIBRARY CONSOLE &amp; INVENTORY MANAGEMENT SYSTEM v2.4]</text>
    <text x="75" y="155" fill="#38BDF8">═════════════════════════════════════════════════════════════════════</text>
    
    <text x="75" y="185" fill="#10B981">&gt; Initializing Database Connection ... [SUCCESS]</text>
    <text x="75" y="205" fill="#10B981">&gt; Loaded 1,420 Book entities with Polymorphic Media classes.</text>
    
    <text x="75" y="235" fill="#F8FAFC"><tspan fill="#F59E0B">chamathka@sliit:~$</tspan> java LibraryManager --search --isbn 978-0134685991</text>
    
    <text x="75" y="265" fill="#94A3B8">[RESULT FOUND]</text>
    <text x="75" y="285" fill="#E2E8F0">  Title    : "Effective Java (3rd Edition)" by Joshua Bloch</text>
    <text x="75" y="305" fill="#E2E8F0">  Status   : <tspan fill="#10B981" font-weight="700">AVAILABLE</tspan> (Shelf: CS-B04, Floor 2, Main Campus Library)</text>
    <text x="75" y="325" fill="#E2E8F0">  Handlers : LoanTransactionHandler, BorrowLimitValidator</text>
    
    <text x="75" y="355" fill="#F8FAFC"><tspan fill="#F59E0B">chamathka@sliit:~$</tspan> <tspan fill="#00F0FF">_</tspan></text>
  </g>

  <!-- Micro UML Badge floating -->
  <rect x="520" y="220" width="200" height="150" rx="8" fill="#111B30" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />
  <rect x="520" y="220" width="200" height="26" rx="8" fill="#16233F" />
  <text x="620" y="238" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">&lt;&lt;Interface&gt;&gt; IBookService</text>
  <text x="532" y="265" fill="#94A3B8" font-family="monospace" font-size="9">+ borrowItem(int userId, String isbn)</text>
  <text x="532" y="285" fill="#94A3B8" font-family="monospace" font-size="9">+ returnItem(int txnId)</text>
  <text x="532" y="305" fill="#94A3B8" font-family="monospace" font-size="9">+ calculateOverdueFines(): double</text>
  <text x="532" y="325" fill="#94A3B8" font-family="monospace" font-size="9">+ generateAuditReport(): File</text>
  <rect x="532" y="340" width="176" height="20" rx="4" fill="rgba(0, 240, 255, 0.15)" />
  <text x="620" y="354" fill="#00F0FF" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">OOP Encapsulation Active</text>
</svg>
