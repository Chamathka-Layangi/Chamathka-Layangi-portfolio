<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#061226" />
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="circuit-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bg-grad)" stroke="url(#cyber-cyan)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Circuit Board Traces & Nodes -->
  <g stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 50 250 H 120 L 160 210 H 210" />
    <path d="M 450 250 H 380 L 340 290 H 290" />
    <path d="M 250 50 V 120 L 290 160 V 200" />
    <path d="M 250 450 V 380 L 210 340 V 300" />
    <path d="M 100 120 L 150 170 H 200" />
    <path d="M 400 380 L 350 330 H 300" />
    
    <!-- Microcontroller Chip Symbol -->
    <rect x="210" y="210" width="80" height="80" rx="8" fill="#0D1527" stroke="url(#cyber-cyan)" stroke-width="2" />
    <text x="250" y="248" fill="#00F0FF" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">ESP32</text>
    <text x="250" y="268" fill="#94A3B8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" text-anchor="middle">SLIIT • CL</text>
  </g>

  <!-- Node Dots -->
  <circle cx="120" cy="250" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="380" cy="250" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="290" cy="160" r="4" fill="#0066FF" filter="url(#glow)" />
  <circle cx="210" cy="340" r="4" fill="#0066FF" filter="url(#glow)" />
  <circle cx="150" cy="170" r="4" fill="#00F0FF" />
  <circle cx="350" cy="330" r="4" fill="#00F0FF" />

  <!-- Avatar Profile Silhouette -->
  <g id="avatar-figure">
    <!-- Outer Glow Silhouette Aura -->
    <circle cx="250" cy="180" r="55" fill="url(#cyber-cyan)" opacity="0.15" filter="url(#glow)" />
    
    <!-- Head -->
    <circle cx="250" cy="180" r="48" fill="#1E293B" stroke="url(#cyber-cyan)" stroke-width="2.5" />
    
    <!-- Glasses / Visor Futuristic Line -->
    <rect x="222" y="172" width="56" height="12" rx="6" fill="#00F0FF" fill-opacity="0.8" filter="url(#glow)" />
    
    <!-- Hair / Minimalist Modern Style -->
    <path d="M 205 170 Q 250 120 295 170 Q 285 145 250 142 Q 215 145 205 170 Z" fill="#38BDF8" />
    
    <!-- Shoulders / Torso -->
    <path d="M 170 330 C 170 270 200 245 250 245 C 300 245 330 270 330 330 Z" fill="#1E293B" stroke="url(#cyber-cyan)" stroke-width="2" />
    
    <!-- Modern Tech Collar / Circuit Pin -->
    <polygon points="250,265 240,290 260,290" fill="#00F0FF" />
    
    <!-- Initials Badge -->
    <circle cx="250" cy="315" r="16" fill="#0B0F19" stroke="#00F0FF" stroke-width="1.5" />
    <text x="250" y="320" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">CL</text>
  </g>

  <!-- Futuristic Orbit Ring Elements -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#circuit-glow)" stroke-width="2" stroke-dasharray="15 35" opacity="0.7" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="40 80" opacity="0.4" />
</svg>
