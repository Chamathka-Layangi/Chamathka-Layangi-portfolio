<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="event2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="podium-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="symp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#event2-bg)" />

  <!-- Presentation Stage Backdrop -->
  <rect x="50" y="50" width="500" height="250" rx="14" fill="#0B132B" stroke="#1E293B" stroke-width="2" />
  
  <!-- Presentation Slide on Stage Screen -->
  <rect x="70" y="70" width="460" height="210" rx="8" fill="#080F1E" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" />
  
  <text x="300" y="115" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle" filter="url(#symp-glow)">SLIIT COMPUTING PROJECT SYMPOSIUM</text>
  
  <text x="300" y="145" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">TerraPulse: Environmental IoT Telemetry System</text>
  
  <!-- Mini Diagram on Screen -->
  <rect x="110" y="170" width="80" height="50" rx="6" fill="#1E293B" stroke="#00F0FF" />
  <text x="150" y="200" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ESP32</text>
  
  <path d="M 200 195 L 240 195" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3 3" />
  
  <rect x="250" y="170" width="100" height="50" rx="6" fill="#1E293B" stroke="#10B981" />
  <text x="300" y="200" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ThingSpeak API</text>

  <path d="M 360 195 L 400 195" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3 3" />

  <rect x="410" y="170" width="80" height="50" rx="6" fill="#1E293B" stroke="#8B5CF6" />
  <text x="450" y="200" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Live Web UI</text>

  <!-- Award Badge Ribbon -->
  <rect x="235" y="240" width="130" height="26" rx="13" fill="url(#podium-glow)" />
  <text x="300" y="258" fill="#0B0F19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">★ TOP 3 PODIUM ★</text>

  <!-- Overlay Footer Badge -->
  <rect x="40" y="325" width="520" height="50" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="rgba(255,255,255,0.1)" />
  <text x="60" y="355" fill="#00F0FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">STEP 2: ACADEMIC SHOWCASE</text>
  <text x="300" y="355" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Jury Evaluation &amp; Award Presentation at SLIIT</text>
</svg>
